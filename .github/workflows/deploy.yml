name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [main, jekyll-academicpages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Build with Jekyll. jekyll-scholar parses every .bib it finds, so the
      # downloadable copy must NOT exist during the build - it is written
      # into _site afterwards instead. See the next step.
      # The .bib is the source of truth; render it to YAML for Liquid.
      - name: Generate publications data
        run: python scripts/bib2yml.py

      - name: Build with Jekyll
        run: bundle exec jekyll build --trace --profile
        env:
          JEKYLL_ENV: production

      # Publish references.bib as a download. Done after the build so
      # jekyll-scholar never sees the duplicate and tries to parse it.
      - name: Publish bibliography for download
        run: mkdir -p _site/assets && cp _bibliography/references.bib _site/assets/bibliography.bib

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    # Branches build and upload an artifact so the Jekyll build can be verified
    # before it is allowed to replace the live site. Only main deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4