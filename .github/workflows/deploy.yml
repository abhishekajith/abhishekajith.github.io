name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [main, jekyll-academicpages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # _bibliography/references.bib is the single source for the publications
      # page. Publish a copy under /assets so it is downloadable, without
      # keeping a second copy in the repo.
      - name: Expose bibliography for download
        run: |
          mkdir -p assets
          cp _bibliography/references.bib assets/bibliography.bib

      - name: Build with Jekyll
        run: bundle exec jekyll build --trace --profile
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    # Branches build and upload an artifact so the Jekyll build can be verified
    # before it is allowed to replace the live site. Only main deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4