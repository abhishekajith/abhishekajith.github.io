<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Schematic placeholder: TACE embolics">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#232b28"/>
      <stop offset="100%" stop-color="#121514"/>
    </radialGradient>
    <linearGradient id="sphere" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#dff3e9"/>
      <stop offset="55%" stop-color="#8ed0b8"/>
      <stop offset="100%" stop-color="#236251"/>
    </linearGradient>
    <linearGradient id="vessel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8c1c1c"/>
      <stop offset="100%" stop-color="#4a0f0f"/>
    </linearGradient>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="url(#bg2)"/>

  <!-- hepatic artery branch -->
  <g>
    <path d="M40 200 C 160 190, 210 150, 300 165 C 380 178, 440 150, 620 120"
          fill="none" stroke="url(#vessel)" stroke-width="30" stroke-linecap="round" opacity="0.9"/>
    <path d="M300 165 C 320 215, 330 250, 300 320"
          fill="none" stroke="url(#vessel)" stroke-width="17" stroke-linecap="round" opacity="0.85"/>
    <path d="M440 152 C 470 200, 500 230, 560 268"
          fill="none" stroke="url(#vessel)" stroke-width="13" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- embolic particles occluding the branch -->
  <g filter="url(#blur2)">
    <circle cx="392" cy="160" r="16" fill="url(#sphere)"/>
    <circle cx="424" cy="152" r="13" fill="url(#sphere)" opacity="0.94"/>
    <circle cx="452" cy="146" r="17" fill="url(#sphere)" opacity="0.9"/>
    <circle cx="484" cy="136" r="12" fill="url(#sphere)" opacity="0.92"/>
    <circle cx="512" cy="128" r="15" fill="url(#sphere)" opacity="0.88"/>
    <circle cx="540" cy="124" r="11" fill="url(#sphere)" opacity="0.9"/>
    <circle cx="308" cy="228" r="12" fill="url(#sphere)" opacity="0.9"/>
    <circle cx="300" cy="268" r="10" fill="url(#sphere)" opacity="0.88"/>
  </g>

  <!-- drug-loaded core hints -->
  <g fill="#e9bf60" opacity="0.9">
    <circle cx="387" cy="156" r="3.2"/>
    <circle cx="397" cy="165" r="2.4"/>
    <circle cx="449" cy="142" r="3"/>
    <circle cx="456" cy="151" r="2.2"/>
    <circle cx="508" cy="125" r="2.8"/>
    <circle cx="517" cy="132" r="2"/>
  </g>

  <!-- radiopaque nanocellulose halo -->
  <g stroke="#5bb498" stroke-width="1.3" opacity="0.75" fill="none">
    <circle cx="392" cy="160" r="20"/>
    <circle cx="452" cy="146" r="21"/>
    <circle cx="512" cy="128" r="19"/>
  </g>

  <g font-family="Inter, sans-serif" font-size="13" fill="#eceae4" opacity="0.72">
    <text x="28" y="40">placeholder — replace with</text>
    <text x="28" y="58">particle-size distribution</text>
    <text x="28" y="76">or histology micrograph</text>
  </g>

  <g font-family="Inter, sans-serif" font-size="12">
    <path d="M486 214 L454 176" stroke="#8ed0b8" stroke-width="1.2"/>
    <circle cx="488" cy="216" r="2.6" fill="#8ed0b8"/>
    <text x="494" y="220" fill="#8ed0b8">radiopaque nanocellulose</text>

    <path d="M180 300 L300 262" stroke="#e9bf60" stroke-width="1.2"/>
    <circle cx="178" cy="302" r="2.6" fill="#e9bf60"/>
    <text x="52" y="312" fill="#f2d99c">drug-eluting porous microsphere</text>
  </g>

  <g stroke="#eceae4" stroke-width="2" opacity="0.6">
    <path d="M540 372 h64"/>
    <path d="M540 366 v12 M604 366 v12"/>
  </g>
  <text x="572" y="362" font-family="Inter, sans-serif" font-size="10" fill="#eceae4" opacity="0.7" text-anchor="middle">100 µm</text>
</svg>